name: Settlement regression

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    name: Regression suite against the settlement job as found
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run the regression suite
        run: mvn --batch-mode --no-transfer-progress verify

      - name: Summarise the results
        if: always()
        run: python3 ci/surefire_report.py summary target/surefire-reports "Settlement job as found (legacy)"

      - name: Keep the Surefire reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: surefire-reports-legacy
          path: target/surefire-reports/
